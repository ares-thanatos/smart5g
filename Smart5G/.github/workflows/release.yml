name: Build and Release Smart5G APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Asset
        run: cp app/build/outputs/apk/debug/app-debug.apk Smart5G.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart5G-APK
          path: Smart5G.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Smart5G ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: Smart5G.apk
          body: |
            ## 📶 Smart5G Release ${{ github.ref_name }}
            
            Android cellular network analyzer and indoor coverage optimization system.
            
            ### 📱 Download & Installation
            1. Download the **`Smart5G.apk`** asset attached below to your Android phone.
            2. Tap to install (enable "Install unknown apps" if prompted).
            3. Grant Phone & Location permissions for live 5G/4G cellular baseband telemetry.
            
            ### 🚀 Key Features in this Release
            - **Live 5G/LTE Telemetry**: RSRP (dBm), RSRQ (dB), SINR (dB), 5G SA/NSA detection.
            - **Tower Identifiers**: Physical Cell ID (PCI), Cell Identity (CI), Tracking Area Code (TAC), ARFCN.
            - **Multi-Stream Speed Test**: Parallel throughput benchmarking with animated radial speedometer.
            - **Room Survey**: Multi-sample median signal and variance tracking to find the optimal 5G router spot.
            - **Signal Stability Timeline**: Live graph of signal fading as you walk between rooms.
            - **Dual SIM Support**: Detects and displays active carrier subscriptions.
            - **Dark & Light Mode**: AMOLED-optimized theme.
